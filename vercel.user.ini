; Aili's Craft — Vercel PHP runtime hardening variant.
; On Vercel the web root is read-only, so file sessions must write to /tmp.
; Deploy as .user.ini (rename) when targeting Vercel with AC_SESSION_DRIVER=files.
display_errors = Off
log_errors = On
html_errors = Off
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.save_path = "/tmp"
; Enable ONLY when serving over HTTPS (Vercel always is, once a domain is attached):
; session.cookie_secure = 1
